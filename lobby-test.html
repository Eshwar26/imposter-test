<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Cinefied · Core test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/core.css?v=0.2.0">
<style>
  /* the stand-in "game" shown after START, just to prove the hand-off works */
  .game{display:none;min-height:100vh;min-height:100dvh;max-width:460px;margin:0 auto;flex-direction:column;align-items:center;justify-content:center;
        gap:14px;padding:24px 20px;text-align:center}
  .game.on{display:flex}
  .game h1{font-family:var(--display);font-weight:400;font-size:56px;letter-spacing:3px;line-height:.95}
  .game p{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:30ch}
  .game ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .game li{font-size:12px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px}
  .game li.off{opacity:.45}
  .ver{position:fixed;left:0;right:0;bottom:calc(4px + env(safe-area-inset-bottom,0px));text-align:center;font-size:9.5px;color:var(--muted);opacity:.6;pointer-events:none}
</style>
</head>
<body>
<section class="game" id="game">
  <h1>GAME ON</h1>
  <p>The real Pictionary screen goes here. This page only tests rooms, joining and the leader.</p>
  <ul id="gPlayers"></ul>
  <div id="gAct" style="width:100%"></div>
</section>
<p class="ver" id="ver"></p>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="core/core.js?v=0.2.0"></script>
<script src="core/core-ui.js?v=0.2.0"></script>
<script>
  const C = Cinefied, esc = C.esc;
  const game = document.getElementById('game');

  function drawGame(v) {
    document.getElementById('gPlayers').innerHTML = v.players.map(p =>
      `<li class="${p.online === false ? 'off' : ''}">${esc(p.name)}${p.uid === v.room.leader ? ' 👑' : ''}</li>`).join('');
    document.getElementById('gAct').innerHTML = v.isLeader
      ? '<button class="btn outline" type="button" id="backLobby">BACK TO WAITING ROOM</button>'
      : '<p>Only the leader can end the game.</p>';
  }
  document.addEventListener('click', e => { if (e.target.closest('#backLobby')) C.setPhase('waiting').catch(err => CinefiedUI.say(C.message(err))); });

  CinefiedUI.mount({
    game: {
      id: 'pictionary', name: 'Pictionary', shelf: 'Play together', color: 'var(--accent)', glyph: 'P',
      pitch: 'Draw the movie. Everyone else races to guess it before time runs out.',
      facts: ['3+ players', 'Each on own phone', '~15 min'],
      rules: ['Each turn, one player gets a secret movie and draws it on their phone.',
              'Everyone else sees the drawing live and types guesses.',
              'Guess faster, score more. The drawer scores when people get it.',
              'Everyone takes a turn drawing. Most points after the last round wins.'],
      min: 3, max: 8,
      settings: [
        { key: 'rounds', label: 'Rounds', options: [2, 3, 5], default: 3, summary: v => `${v} rounds` },
        { key: 'time', label: 'Draw time', options: [60, 80, 100], default: 80, show: v => `${v}s` },
        { key: 'movies', label: 'Movies', options: ['All movies', '2000s', '2010s', 'Big hits'], default: 'All movies' },
      ],
    },
    gameNames: { pictionary: 'Pictionary', imposter: 'Imposter', cluepool: 'Clue Pool', tierd: "Tier'd" },
    onBack: () => CinefiedUI.say('In the app this goes back to the home screen'),
    onStart: v => { game.classList.add('on'); drawGame(v); },
    onUpdate: drawGame,
    onLobby: () => game.classList.remove('on'),
  });
  C.init().then(m => { document.getElementById('ver').textContent = `core v${C.version} · player ${m.uid.slice(0, 6)}`; }).catch(() => {});
</script>
</body>
</html>
